name: Stylua

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "**/*.lua"
      - .stylua.toml
      - .github/workflows/stylua.yaml
  pull_request:
    paths:
      - "**/*.lua"
      - .stylua.toml
      - .github/workflows/stylua.yaml

env:
  CLICOLOR: 1

jobs:
  stylua:
    name: Check lua files using Stylua
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Stylua Check Repo
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --color=always --check .
